<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Client Dashboard — SCM Bridge OS</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/scm-styles.css"/>
<style>
body{font-family:'Barlow',sans-serif;background:var(--gray-bg);color:var(--black);font-size:14px;line-height:1.5}
input,textarea,select,button{font-family:inherit}
button{cursor:pointer;border:none;background:none}
textarea{resize:vertical}
.screen{display:none;min-height:100vh}.screen.active{display:block}

/* HOME */
#home{background:var(--navy)}
.home-wrap{max-width:760px;margin:0 auto;padding:36px 24px 60px}
.home-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-bd);margin-bottom:6px}
.home-title{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;color:var(--white);line-height:1.1;margin-bottom:4px}
.home-sub{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:28px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.btn-primary{background:var(--teal);color:var(--white);border-radius:10px;padding:11px 22px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:filter .15s}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:11px 18px;font-size:13px;transition:background .15s}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.new-form{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:20px;margin-bottom:24px;display:none;animation:fadeUp .2s ease}
.nf-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-bd);margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fg-full{grid-column:1/-1}
.fl label{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-bd);margin-bottom:3px}
.fl input,.fl select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--white);outline:none}
.fl input::placeholder{color:rgba(255,255,255,.3)}
.fl select option{background:var(--navy)}
.sessions-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:8px}
.proj-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;transition:background .15s}
.proj-card:hover{background:rgba(255,255,255,.1)}
.proj-info{flex:1;min-width:0}
.proj-client{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;font-family:'Barlow Condensed',sans-serif;font-weight:700;margin-bottom:1px}
.proj-name{font-size:16px;color:var(--white);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-meta{font-size:11px;color:rgba(255,255,255,.4)}
.proj-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-on-track{background:#1D9E75}
.dot-at-risk{background:#EF9F27}
.dot-blocked{background:#D85A30}
.dot-completed{background:#6C4EBF}
.btn-sm{border-radius:8px;padding:7px 14px;font-size:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn-teal{background:var(--teal);color:var(--white)}
.btn-danger{color:rgba(255,80,80,.5);font-size:11px;padding:4px}
.empty{text-align:center;padding:48px 0;color:rgba(255,255,255,.3);font-size:14px}

/* FORM */
#form-screen{background:var(--gray-bg)}
.form-hdr{background:var(--teal-dk);padding:12px 18px 10px;position:sticky;top:52px;z-index:100;box-shadow:0 2px 14px rgba(0,0,0,.22)}
.form-hdr-inner{max-width:900px;margin:0 auto}
.form-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.form-back{font-size:18px;color:var(--teal-lt);background:rgba(255,255,255,.1);border-radius:8px;padding:4px 10px}
.form-back:hover{background:rgba(255,255,255,.2)}
.form-heading{flex:1;font-size:15px;color:var(--white);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form-actions{display:flex;gap:7px;align-items:center;flex-shrink:0}
.save-msg{font-size:11px;color:var(--teal-bd);min-width:55px}
.btn-blue{background:var(--blue-btn);color:var(--white);border-radius:20px;padding:8px 18px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.form-body{max-width:900px;margin:0 auto;padding:14px 14px 60px}
.sec-card{background:var(--white);border-radius:14px;overflow:hidden;margin-bottom:10px;border:1px solid var(--gray-line);animation:fadeUp .2s ease}
.sec-hdr{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;user-select:none;background:#FAFAF8}
.sec-icon{font-size:15px}
.sec-title{flex:1;font-size:14px;font-weight:500}
.sec-chev{font-size:11px;color:var(--gray-mid);transition:transform .2s}
.sec-chev.open{transform:rotate(180deg)}
.sec-body-wrap{display:none}.sec-body-wrap.open{display:block}
.sec-body{padding:16px}
.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px}
.fld-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-mid)}
.sec-in{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--gray-line);border-radius:8px;background:#FAFAF8;color:var(--black)}
.sec-in:focus{outline:none;border-color:var(--teal)}
.sec-sel{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--gray-line);border-radius:8px;background:#FAFAF8;color:var(--black)}
.sec-sel:focus{outline:none;border-color:var(--teal)}
.sec-ta{width:100%;min-height:72px;padding:9px 11px;font-size:13px;border:1px solid var(--gray-line);border-radius:8px;background:#FAFAF8;color:var(--black);line-height:1.6;font-family:'Barlow',sans-serif}
.sec-ta:focus{outline:none;border-color:var(--teal)}
.sec-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-mid);margin-bottom:6px;margin-top:14px}
.sec-lbl:first-child{margin-top:0}

/* DYNAMIC TABLES */
.dt-wrap{overflow-x:auto;margin-bottom:6px}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl th{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-mid);padding:6px 7px;border-bottom:1px solid var(--gray-line);text-align:left;background:#FAFAF8}
.dtbl td{padding:3px 3px;border-bottom:1px solid var(--gray-line);vertical-align:middle}
.dtbl tr:last-child td{border-bottom:none}
.dt-in{width:100%;padding:5px 7px;font-size:12px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--black);font-family:'Barlow',sans-serif}
.dt-in:focus{outline:none;border-color:var(--teal);background:var(--teal-lt)}
.dt-sel{width:100%;padding:4px 5px;font-size:11px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--black);cursor:pointer}
.dt-sel:focus{outline:none;border-color:var(--teal)}
.dt-rm{color:rgba(216,90,48,.35);font-size:15px;padding:2px 5px;cursor:pointer;border-radius:4px;line-height:1;border:none;background:none}
.dt-rm:hover{color:var(--coral);background:var(--coral-lt)}
.btn-add-row{margin-top:6px;font-size:12px;color:var(--teal);padding:5px 11px;border:1px dashed var(--teal-bd);border-radius:7px;background:var(--teal-lt);cursor:pointer;transition:all .15s}
.btn-add-row:hover{background:var(--teal);color:var(--white)}

/* PHASE PILLS */
.phase-pills{display:flex;flex-wrap:wrap;gap:6px}
.phase-pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-line);color:var(--gray-mid);transition:all .12s;user-select:none}
.phase-pill.act{background:var(--navy);border-color:var(--teal-bd);color:var(--teal-bd)}

/* STATUS PILLS */
.status-pills{display:flex;gap:8px;flex-wrap:wrap}
.sp{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-line);color:var(--gray-mid);transition:all .15s}
.sp-on-track.act{background:#E1F5EE;border-color:var(--teal);color:var(--teal-dk)}
.sp-at-risk.act{background:var(--amber-lt);border-color:var(--amber);color:#7A5200}
.sp-blocked.act{background:var(--coral-lt);border-color:var(--coral);color:var(--coral)}
.sp-completed.act{background:var(--purple-lt);border-color:var(--purple);color:var(--purple)}

/* EXPORT BUTTON */
.btn-export{background:#6C4EBF;color:var(--white);border-radius:20px;padding:8px 18px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* PREVIEW */
#preview-screen{background:#e8e8e8}
.prev-hdr{background:var(--navy);padding:10px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:52px;z-index:100}
.prev-title{flex:1;font-size:13px;color:rgba(255,255,255,.5)}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.fg,.sec-grid{grid-template-columns:1fr}.fg-full,.sec-full{grid-column:1}}
</style>
</head>
<body class="light-mode">
<div id="site-nav-root"></div>
<script src="../nav.js"></script>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-wrap">
    <div class="home-label">SCM Solution LTD</div>
    <div class="home-title">Client Dashboard</div>
    <div class="home-sub">Project status portal — updates, blockers, documents, and milestones for each client engagement</div>
    <div class="btn-row">
      <button class="btn-primary" onclick="showNewForm()">+ New Client Project</button>
    </div>
    <div class="new-form" id="new-form">
      <div class="nf-title">New Client Dashboard</div>
      <div class="fg">
        <div class="fl"><label>Client Name *</label><input id="nf-client" placeholder="e.g. Acme Wearables"/></div>
        <div class="fl"><label>Project Name *</label><input id="nf-proj" placeholder="e.g. SmartVest Gen 2"/></div>
        <div class="fl"><label>Project Code</label><input id="nf-code" placeholder="e.g. SCM-2025-004"/></div>
        <div class="fl"><label>Current Phase</label>
          <select id="nf-phase">
            <option value="idea">Idea / Concepting</option>
            <option value="poc">Proof of Concept</option>
            <option value="design" selected>Detail Design</option>
            <option value="test">Validation / Testing</option>
            <option value="factory">Factory Qualification</option>
            <option value="mp">Mass Production</option>
          </select>
        </div>
        <div class="fl"><label>PM / Lead</label><input id="nf-pm" placeholder="SCM Solution LTD"/></div>
        <div class="fl"><label>PM Email</label><input id="nf-email" type="email" placeholder=""/></div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="createDash()">Create Dashboard</button>
        <button class="btn-ghost" onclick="hideNewForm()">Cancel</button>
      </div>
    </div>
    <div class="sessions-label">Active Projects</div>
    <div id="proj-list"><div class="empty">No projects yet — tap New Client Project to begin</div></div>
  </div>
</div>

<!-- FORM -->
<div id="form-screen" class="screen">
  <div class="form-hdr">
    <div class="form-hdr-inner">
      <div class="form-top">
        <button class="form-back" onclick="goHome()">←</button>
        <div class="form-heading" id="form-heading">Client Dashboard</div>
        <div class="form-actions">
          <span class="save-msg" id="save-msg"></span>
          <button class="btn-blue" onclick="goPreview()">Preview</button>
        </div>
      </div>
    </div>
  </div>
  <div class="form-body" id="form-body"></div>
</div>

<!-- PREVIEW -->
<div id="preview-screen" class="screen">
  <div class="prev-hdr">
    <button class="form-back" onclick="goForm()" style="color:#fff;font-size:18px;background:rgba(255,255,255,.1);border-radius:8px;padding:4px 10px">←</button>
    <span class="prev-title" id="prev-title">Client View</span>
    <button class="btn-export" onclick="exportHTML()" style="margin-right:8px">Export HTML</button>
    <button class="btn-teal btn-sm" onclick="printDash()">Print / PDF</button>
  </div>
  <iframe id="prev-iframe" style="width:100%;height:calc(100vh - 104px);border:none;background:#fff"></iframe>
</div>

<script>
var SAVE_KEY='scm_client_dash_v1', ALL=[], CUR=null, _st=null;
var PHASES=[
  {k:'idea',l:'Idea',sub:'Concepting'},
  {k:'poc',l:'PoC',sub:'Proof of Concept'},
  {k:'design',l:'Design',sub:'Detail Design'},
  {k:'test',l:'Test',sub:'Validation'},
  {k:'factory',l:'Factory',sub:'Qualification'},
  {k:'mp',l:'MP',sub:'Mass Production'}
];
var STATUS=[
  {k:'on-track',l:'On Track'},
  {k:'at-risk',l:'At Risk'},
  {k:'blocked',l:'Blocked'},
  {k:'completed',l:'Completed'}
];
var STATUS_COLOR={'on-track':'#1D9E75','at-risk':'#EF9F27','blocked':'#D85A30','completed':'#6C4EBF'};
var STATUS_BG={'on-track':'#E1F5EE','at-risk':'#FAEEDA','blocked':'#FAECE7','completed':'#EDE8F8'};
var DOC_TYPES=['TRD','Project Brief','RFI Response','RFQ / Quotation','Tech Pack','NDA','SOW','Sample Photos','Test Report','Factory Audit','Other'];
var UPDATE_CATS=['Update','Milestone','Decision','Alert','Document Shared'];
var MS_STATUS=['Upcoming','In Progress','Complete','At Risk','Delayed'];
var BLK_STATUS=['Open','Client Action Required','In Progress','Resolved'];

function loadAll(){ try{ ALL=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]'); }catch(e){ ALL=[]; } }
function saveAll(){
  localStorage.setItem(SAVE_KEY,JSON.stringify(ALL));
  var m=document.getElementById('save-msg');
  if(m){m.textContent='Saved ✓';setTimeout(function(){m.textContent='';},1500);}
}
function debounceSave(){
  clearTimeout(_st);
  _st=setTimeout(function(){ if(!CUR)return; var i=ALL.findIndex(function(t){return t.id===CUR.id;}); if(i===-1)ALL.push(CUR);else ALL[i]=CUR; saveAll(); },600);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function today(){ return new Date().toISOString().slice(0,10); }

function blankDash(meta){
  return {
    id:uid(), created:today(), meta:meta,
    updates:[],
    blockers:[],
    documents:[],
    milestones:[]
  };
}

function show(id){ document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');}); document.getElementById(id).classList.add('active'); }
function goHome(){ show('home'); renderList(); }
function goForm(){ show('form-screen'); }
function goPreview(){ show('preview-screen'); renderPreview(); }

function showNewForm(){
  document.getElementById('new-form').style.display='block';
  document.getElementById('nf-pm').value='SCM Solution LTD';
}
function hideNewForm(){ document.getElementById('new-form').style.display='none'; }

function createDash(){
  var c=document.getElementById('nf-client').value.trim();
  var p=document.getElementById('nf-proj').value.trim();
  if(!c||!p){alert('Client name and project name are required');return;}
  var meta={
    clientName:c, projectName:p, projectCode:document.getElementById('nf-code').value.trim(),
    phase:document.getElementById('nf-phase').value, status:'on-track',
    targetDate:'', overview:'',
    pmName:document.getElementById('nf-pm').value.trim()||'SCM Solution LTD',
    pmEmail:document.getElementById('nf-email').value.trim(),
    pmPhone:'', lastUpdated:today()
  };
  CUR=blankDash(meta); ALL.push(CUR); saveAll(); hideNewForm(); openDash(CUR);
}
function openDash(d){ CUR=d; show('form-screen'); updateHeading(); renderForm(); }
function openById(id){ var d=ALL.find(function(x){return x.id===id;}); if(d)openDash(d); }
function deleteDash(id){ if(!confirm('Delete this client dashboard?'))return; ALL=ALL.filter(function(d){return d.id!==id;}); saveAll(); renderList(); }
function updateHeading(){ document.getElementById('form-heading').textContent=CUR.meta.clientName+' — '+CUR.meta.projectName; }

var PHASE_LABEL={idea:'Idea',poc:'PoC',design:'Design',test:'Test',factory:'Factory',mp:'Mass Production'};

function renderList(){
  var el=document.getElementById('proj-list');
  if(!ALL.length){el.innerHTML='<div class="empty">No projects yet — tap New Client Project to begin</div>';return;}
  el.innerHTML=ALL.slice().reverse().map(function(d){
    var dotCls='dot-'+d.meta.status;
    var ph=PHASE_LABEL[d.meta.phase]||d.meta.phase;
    var sl=STATUS.find(function(s){return s.k===d.meta.status;}); var sl2=sl?sl.l:'On Track';
    return '<div class="proj-card">'
      +'<div class="status-dot '+dotCls+'"></div>'
      +'<div class="proj-info"><div class="proj-client">'+esc(d.meta.clientName)+'</div>'
      +'<div class="proj-name">'+esc(d.meta.projectName)+(d.meta.projectCode?'<span style="font-size:11px;opacity:.4;margin-left:8px">'+esc(d.meta.projectCode)+'</span>':'')+'</div>'
      +'<div class="proj-meta">Phase: '+esc(ph)+' · Status: '+esc(sl2)+' · Updated: '+esc(d.meta.lastUpdated)+'</div></div>'
      +'<div class="proj-actions">'
      +'<button class="btn-teal btn-sm" onclick="event.stopPropagation();openById(\''+d.id+'\')">Open</button>'
      +'<button class="btn-danger" onclick="event.stopPropagation();deleteDash(\''+d.id+'\')">Delete</button>'
      +'</div></div>';
  }).join('');
}

var OPEN_SECS={meta:true,updates:true};
function toggleSec(k){
  OPEN_SECS[k]=!OPEN_SECS[k];
  document.getElementById('sbw-'+k).className='sec-body-wrap'+(OPEN_SECS[k]?' open':'');
  document.getElementById('sch-'+k).className='sec-chev'+(OPEN_SECS[k]?' open':'');
}
function renderForm(){
  var secs=[
    {key:'meta',icon:'🏢',title:'Project Info'},
    {key:'updates',icon:'📢',title:'Updates & Activity'},
    {key:'blockers',icon:'🚧',title:'Blockers & Actions Required'},
    {key:'documents',icon:'📁',title:'Documents Shared'},
    {key:'milestones',icon:'🎯',title:'Milestones & Schedule'},
    {key:'contact',icon:'📞',title:'Contact & Support'}
  ];
  document.getElementById('form-body').innerHTML=secs.map(function(s){
    if(!OPEN_SECS.hasOwnProperty(s.key)) OPEN_SECS[s.key]=false;
    return '<div class="sec-card"><div class="sec-hdr" onclick="toggleSec(\''+s.key+'\')">'
      +'<span class="sec-icon">'+s.icon+'</span><span class="sec-title">'+s.title+'</span>'
      +'<span class="sec-chev'+(OPEN_SECS[s.key]?' open':'')+'" id="sch-'+s.key+'">▾</span>'
      +'</div><div class="sec-body-wrap'+(OPEN_SECS[s.key]?' open':'')+'" id="sbw-'+s.key+'">'
      +build(s.key)+'</div></div>';
  }).join('');
}
function rerender(k){ var el=document.getElementById('sbw-'+k); if(el)el.innerHTML=build(k); }
function build(k){
  if(k==='meta')       return bMeta();
  if(k==='updates')    return bUpdates();
  if(k==='blockers')   return bBlockers();
  if(k==='documents')  return bDocuments();
  if(k==='milestones') return bMilestones();
  if(k==='contact')    return bContact();
  return '';
}

/* META */
function bMeta(){
  var m=CUR.meta;
  var phPills=PHASES.map(function(p){
    return '<div class="phase-pill'+(m.phase===p.k?' act':'')+'" onclick="CUR.meta.phase=\''+p.k+'\';debounceSave();rerender(\'meta\')">'+p.l+'</div>';
  }).join('');
  var spPills=STATUS.map(function(s){
    return '<div class="sp sp-'+s.k+(m.status===s.k?' act':'')+'" onclick="CUR.meta.status=\''+s.k+'\';debounceSave();rerender(\'meta\')">'+s.l+'</div>';
  }).join('');
  return '<div class="sec-body"><div class="sec-grid">'
    +'<div class="fld"><label class="fld-lbl">Client Name</label><input class="sec-in" value="'+esc(m.clientName)+'" onchange="CUR.meta.clientName=this.value;updateHeading();debounceSave()"/></div>'
    +'<div class="fld"><label class="fld-lbl">Project Name</label><input class="sec-in" value="'+esc(m.projectName)+'" onchange="CUR.meta.projectName=this.value;updateHeading();debounceSave()"/></div>'
    +'<div class="fld"><label class="fld-lbl">Project Code</label><input class="sec-in" value="'+esc(m.projectCode||'')+'" onchange="CUR.meta.projectCode=this.value;debounceSave()"/></div>'
    +'<div class="fld"><label class="fld-lbl">Target Completion</label><input type="date" class="sec-in" value="'+esc(m.targetDate||'')+'" onchange="CUR.meta.targetDate=this.value;debounceSave()"/></div>'
    +'<div class="fld sec-full"><label class="fld-lbl">Project Overview (shown to client)</label><textarea class="sec-ta" onchange="CUR.meta.overview=this.value;debounceSave()" placeholder="Brief description of what this project is and what SCM Solution is doing on this engagement">'+esc(m.overview||'')+'</textarea></div>'
    +'</div>'
    +'<div class="sec-lbl">Current Phase</div><div class="phase-pills">'+phPills+'</div>'
    +'<div class="sec-lbl" style="margin-top:14px">Project Status</div><div class="status-pills">'+spPills+'</div>'
    +'</div>';
}

/* UPDATES */

    +'<div style="text-align:center;padding-top:24px;font-size:11px;color:#bbb">'
    +'SCM Solution LTD · '+esc(m.clientName)+' · '+esc(m.projectName)+(m.projectCode?' · '+esc(m.projectCode):'')
    +'<br/>This document is confidential and intended only for the named client</div>'
    +'</div></body></html>';
}

function renderPreview(){
  var m=CUR.meta;
  document.getElementById('prev-title').textContent=m.clientName+' — '+m.projectName;
  CUR.meta.lastUpdated=today(); debounceSave();
  var html=generateHTML();
  var iframe=document.getElementById('prev-iframe');
  iframe.contentDocument.open(); iframe.contentDocument.write(html); iframe.contentDocument.close();
}
function printDash(){ document.getElementById('prev-iframe').contentWindow.print(); }
function exportHTML(){
  var m=CUR.meta;
  var html=generateHTML();
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(m.projectCode||m.clientName).replace(/[^a-zA-Z0-9-_]/g,'-')+'-dashboard.html';
  a.click(); URL.revokeObjectURL(a.href);
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

loadAll(); renderList();
</script>
</body>
</html>
