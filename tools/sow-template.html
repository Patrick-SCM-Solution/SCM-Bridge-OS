<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOW Template — SCM Bridge OS</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/scm-styles.css">
<style>

/* ── LAYOUT ──────────────────────────────────────────────────── */
.sow-builder { display:grid; grid-template-columns:360px 1fr; gap:28px; align-items:start; }

.sow-form { position:sticky; top:20px; max-height:calc(100vh - 80px); overflow-y:auto; padding-right:4px; }
.sow-form::-webkit-scrollbar { width:4px; }
.sow-form::-webkit-scrollbar-track { background:transparent; }
.sow-form::-webkit-scrollbar-thumb { background:var(--bdr); border-radius:2px; }

/* ── FORM ────────────────────────────────────────────────────── */
.fs { background:var(--surf); border:1px solid var(--bdr); border-radius:6px; margin-bottom:10px; overflow:hidden; }
.fs-head {
  padding:10px 14px; background:var(--mid);
  font-family:"Barlow Condensed",sans-serif; font-size:11px; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  cursor:pointer; display:flex; align-items:center; justify-content:space-between;
  user-select:none; transition:color .15s;
}
.fs-head.open { color:var(--scm-blue); border-bottom:1px solid var(--bdr); }
.fs-body { display:none; padding:14px; }
.fs-body.open { display:block; }

.fl { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; display:block; }
.fi, .fta, .fsel {
  width:100%; background:var(--dark); border:1px solid var(--bdr); border-radius:4px;
  padding:7px 10px; color:var(--text); font-family:Barlow,sans-serif; font-size:12px;
  outline:none; transition:border-color .15s; box-sizing:border-box;
}
.fi:focus, .fta:focus, .fsel:focus { border-color:var(--scm-blue); }
.fta { resize:vertical; min-height:64px; }
.fsel option { background:var(--mid); }
.fr { margin-bottom:10px; }
.fr2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

.dyn-wrap { margin-bottom:6px; }
.dyn-row { display:flex; gap:6px; padding:6px 0; border-bottom:1px solid rgba(30,58,85,.3); align-items:center; }
.dyn-row:last-child { border-bottom:none; }
.dyn-row .fi { margin:0; }

.btn-rm {
  background:rgba(252,129,129,.08); border:1px solid rgba(252,129,129,.2); color:var(--scm-warn);
  border-radius:4px; padding:0 8px; cursor:pointer; font-size:13px; font-weight:700;
  height:32px; min-width:28px; display:flex; align-items:center; justify-content:center;
  transition:all .15s; flex-shrink:0;
}
.btn-rm:hover { background:rgba(252,129,129,.15); }
.btn-add {
  font-family:"Barlow Condensed",sans-serif; font-size:11px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; padding:6px 10px; border-radius:4px;
  cursor:pointer; border:1px dashed var(--bdr); background:transparent; color:var(--muted);
  transition:all .15s; margin-top:6px; width:100%;
}
.btn-add:hover { border-color:var(--scm-blue); color:var(--scm-blue); }

/* ── PREVIEW WRAPPER ─────────────────────────────────────────── */
.sow-pw { background:var(--surf); border:1px solid var(--bdr); border-radius:6px; overflow:hidden; }
.sow-toolbar {
  padding:10px 16px; background:var(--mid); border-bottom:1px solid var(--bdr);
  display:flex; align-items:center; justify-content:space-between;
}
.sow-toolbar-label {
  font-family:"Barlow Condensed",sans-serif; font-size:11px; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
}
.btn-print {
  font-family:"Barlow Condensed",sans-serif; font-size:11px; font-weight:800;
  letter-spacing:.1em; text-transform:uppercase; padding:6px 18px; border-radius:4px;
  cursor:pointer; border:1px solid var(--scm-blue); background:rgba(27,155,212,.1);
  color:var(--scm-blue); transition:all .15s;
}
.btn-print:hover { background:rgba(27,155,212,.2); }

/* ── SOW DOCUMENT (white / printable) ────────────────────────── */
#sow-doc {
  padding:40px 48px; background:#fff; color:#1a1a1a;
  font-family:Barlow,sans-serif; font-size:13px; line-height:1.65; min-height:860px;
}
.sd-hd { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; padding-bottom:18px; border-bottom:2px solid #1B9BD4; }
.sd-co { font-family:"Barlow Condensed",sans-serif; font-size:22px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:#1B9BD4; margin-bottom:2px; }
.sd-co-sub { font-size:11px; color:#777; }
.sd-meta { text-align:right; font-size:12px; color:#555; line-height:1.6; }
.sd-meta strong { color:#111; font-size:14px; display:block; margin-bottom:2px; }

.sd-title { font-family:"Barlow Condensed",sans-serif; font-size:26px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:#111; margin-bottom:4px; }
.sd-proj { font-size:15px; font-weight:600; color:#1B9BD4; margin-bottom:22px; }

.sd-parties { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:28px; padding:16px 18px; background:#f7f9fb; border-radius:5px; border:1px solid #dde4ec; }
.sd-party-lbl { font-family:"Barlow Condensed",sans-serif; font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#888; margin-bottom:5px; }
.sd-party-name { font-size:13px; font-weight:700; color:#111; margin-bottom:1px; }
.sd-party-det { font-size:12px; color:#555; }

.sd-sec { margin-bottom:26px; }
.sd-sec-title { font-family:"Barlow Condensed",sans-serif; font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#1B9BD4; margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid #e2e8f0; }
.sd-text { font-size:12.5px; color:#333; line-height:1.65; }
.sd-text p { margin:0 0 8px; }
.sd-text p:last-child { margin:0; }

.sd-table { width:100%; border-collapse:collapse; font-size:12px; }
.sd-table th { background:#f0f4f8; color:#1B9BD4; font-family:"Barlow Condensed",sans-serif; font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:8px 12px; text-align:left; border-bottom:1px solid #d0dce8; }
.sd-table td { padding:8px 12px; border-bottom:1px solid #edf0f4; vertical-align:top; }
.sd-table tr:last-child td { border-bottom:none; }

.sd-ms { display:flex; flex-direction:column; gap:5px; }
.sd-ms-row { display:flex; justify-content:space-between; padding:7px 12px; background:#f7f9fb; border-radius:4px; font-size:12px; }
.sd-ms-name { font-weight:600; color:#111; }
.sd-ms-date { color:#555; }

.sd-inv { background:#f0f7ff; border:1px solid #bcd6ee; border-radius:5px; padding:16px 20px; }
.sd-inv-total { font-family:"Barlow Condensed",sans-serif; font-size:26px; font-weight:800; color:#1B9BD4; margin-bottom:3px; }
.sd-inv-note { font-size:11px; color:#666; margin-bottom:10px; }
.sd-pay-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #d8e8f4; font-size:12px; }
.sd-pay-row:last-child { border-bottom:none; }

.sd-list { list-style:none; padding:0; margin:0; }
.sd-list li { padding:4px 0 4px 18px; position:relative; font-size:12px; color:#333; border-bottom:1px solid #edf0f4; }
.sd-list li:last-child { border-bottom:none; }
.sd-list.check li::before { content:"✓"; position:absolute; left:0; color:#2AAB6E; font-size:10px; font-weight:800; top:5px; }
.sd-list.cross li::before { content:"✕"; position:absolute; left:0; color:#e05555; font-size:10px; font-weight:800; top:5px; }

.sd-sigs { display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:44px; padding-top:22px; border-top:1px solid #e0e0e0; }
.sd-sig-co { font-weight:700; font-size:13px; color:#111; margin-bottom:36px; }
.sd-sig-line { border-top:1px solid #bbb; padding-top:5px; font-size:11px; color:#666; }
.sd-sig-date { margin-top:12px; font-size:11px; color:#888; }

/* ── PRINT ───────────────────────────────────────────────────── */
@media print {
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body, html { background:#fff !important; }
  #site-nav-root, nav.site-nav, .site-nav, header, .sow-form, .sow-toolbar { display:none !important; }
  .wrap { padding:0 !important; max-width:none !important; }
  .sow-builder { display:block !important; }
  .sow-pw { border:none !important; box-shadow:none !important; border-radius:0 !important; }
  #sow-doc { padding:24px 32px !important; }
}

@media(max-width:960px) {
  .sow-builder { grid-template-columns:1fr; }
  .sow-form { position:static; max-height:none; }
}
</style>
</head>
<body>
<div id="site-nav-root"></div>
<script src="../nav.js"></script>

<div class="wrap">

  <header>
    <div>
      <h1>SOW <span class="text-blue">Template</span></h1>
      <p class="subtitle" style="margin-bottom:0">Build a client-ready Statement of Work. Fill in the form — the preview updates live. Print or save as PDF when done.</p>
    </div>
  </header>

  <div class="sow-builder">

    <!-- ── FORM ─────────────────────────────────────────────── -->
    <div class="sow-form">

      <!-- Project Info -->
      <div class="fs">
        <div class="fs-head open" onclick="toggleFS(this)">Project Info <span>▾</span></div>
        <div class="fs-body open">
          <div class="fr">
            <label class="fl">Client Company</label>
            <input class="fi" id="f-co" placeholder="ACME Corp" oninput="update()">
          </div>
          <div class="fr2">
            <div class="fr">
              <label class="fl">Contact Name</label>
              <input class="fi" id="f-name" placeholder="Jane Smith" oninput="update()">
            </div>
            <div class="fr">
              <label class="fl">Title</label>
              <input class="fi" id="f-title" placeholder="CEO" oninput="update()">
            </div>
          </div>
          <div class="fr">
            <label class="fl">Contact Email</label>
            <input class="fi" id="f-email" placeholder="jane@acmecorp.com" oninput="update()">
          </div>
          <div class="fr">
            <label class="fl">Project Name</label>
            <input class="fi" id="f-project" placeholder="Supply Chain Audit & Vendor Qualification" oninput="update()">
          </div>
          <div class="fr2">
            <div class="fr">
              <label class="fl">SOW Date</label>
              <input class="fi" id="f-date" type="date" oninput="update()">
            </div>
            <div class="fr">
              <label class="fl">Phase Map Stage</label>
              <select class="fsel" id="f-phase" onchange="update()">
                <option value="">— Select —</option>
                <option>Idea</option>
                <option>PoC</option>
                <option>Design</option>
                <option>Test</option>
                <option>Factory</option>
                <option>MP</option>
                <option>Sustaining</option>
              </select>
            </div>
          </div>
          <div class="fr" style="margin-top:4px">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:9px 12px;border:1px solid var(--bdr);border-radius:4px;transition:border-color .15s;background:var(--dark)" id="senior-lbl">
              <input type="checkbox" id="f-senior" onchange="update();document.getElementById('senior-lbl').style.borderColor=this.checked?'#2AAB6E':''" style="width:15px;height:15px;accent-color:#2AAB6E;cursor:pointer;flex-shrink:0">
              <span>
                <span class="fl" style="margin:0;display:block">Senior BD Sign-Off</span>
                <span style="font-size:10px;color:var(--muted);font-weight:400">Check when Senior BD has reviewed &amp; approved this SOW for issue</span>
              </span>
            </label>
          </div>
        </div>
      </div>

      <!-- Scope -->
      <div class="fs">
        <div class="fs-head open" onclick="toggleFS(this)">Scope <span>▾</span></div>
        <div class="fs-body open">
          <div class="fr">
            <label class="fl">Background</label>
            <textarea class="fta" id="f-bg" placeholder="Brief context — what problem are we solving and why now?" oninput="update()"></textarea>
          </div>
          <label class="fl" style="margin-bottom:6px;display:block">Deliverables</label>
          <div id="del-list" class="dyn-wrap"></div>
          <button class="btn-add" onclick="addDel()">+ Add Deliverable</button>
          <div style="margin-top:14px">
            <label class="fl" style="margin-bottom:6px;display:block">Out of Scope</label>
            <div id="oos-list" class="dyn-wrap"></div>
            <button class="btn-add" onclick="addOOS()">+ Add Out-of-Scope Item</button>
          </div>
        </div>
      </div>

      <!-- Timeline -->
      <div class="fs">
        <div class="fs-head open" onclick="toggleFS(this)">Timeline <span>▾</span></div>
        <div class="fs-body open">
          <div class="fr2">
            <div class="fr">
              <label class="fl">Start Date</label>
              <input class="fi" id="f-start" type="date" oninput="update()">
            </div>
            <div class="fr">
              <label class="fl">Est. Completion</label>
              <input class="fi" id="f-end" type="date" oninput="update()">
            </div>
          </div>
          <label class="fl" style="margin-bottom:6px;display:block">Milestones</label>
          <div id="ms-list" class="dyn-wrap"></div>
          <button class="btn-add" onclick="addMS()">+ Add Milestone</button>
        </div>
      </div>

      <!-- Investment -->
      <div class="fs">
        <div class="fs-head open" onclick="toggleFS(this)">Investment <span>▾</span></div>
        <div class="fs-body open">
          <div class="fr2">
            <div class="fr">
              <label class="fl">Total Investment</label>
              <input class="fi" id="f-total" type="number" placeholder="5000" oninput="update()">
            </div>
            <div class="fr">
              <label class="fl">Currency</label>
              <select class="fsel" id="f-cur" onchange="update()">
                <option>USD</option>
                <option>AUD</option>
                <option>TWD</option>
                <option>EUR</option>
                <option>GBP</option>
              </select>
            </div>
          </div>
          <div class="fr">
            <label class="fl">Payment Schedule</label>
            <select class="fsel" id="f-sched" onchange="refreshSched()">
              <option value="5050">50% on signing · 50% on completion</option>
              <option value="milestone">Milestone-based</option>
              <option value="upfront">100% on signing</option>
              <option value="completion">100% on completion</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div id="custom-pay" style="display:none">
            <label class="fl" style="margin-bottom:6px;display:block">Custom Payments</label>
            <div id="pay-list" class="dyn-wrap"></div>
            <button class="btn-add" onclick="addPay()">+ Add Payment Row</button>
          </div>
          <div class="fr">
            <label class="fl">Invoice Terms</label>
            <select class="fsel" id="f-terms" onchange="update()">
              <option value="14">Net 14 days</option>
              <option value="30">Net 30 days</option>
              <option value="7">Net 7 days</option>
              <option value="0">Due on receipt</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Success Criteria -->
      <div class="fs">
        <div class="fs-head open" onclick="toggleFS(this)">Success Criteria <span>▾</span></div>
        <div class="fs-body open">
          <div id="cr-list" class="dyn-wrap"></div>
          <button class="btn-add" onclick="addCR()">+ Add Criterion</button>
        </div>
      </div>

      <!-- Terms -->
      <div class="fs">
        <div class="fs-head" onclick="toggleFS(this)">Terms <span>▸</span></div>
        <div class="fs-body">
          <div class="fr">
            <label class="fl">Governing Law / Jurisdiction</label>
            <input class="fi" id="f-law" value="Taiwan, ROC" oninput="update()">
          </div>
          <div class="fr">
            <label class="fl">Additional Notes (optional)</label>
            <textarea class="fta" id="f-notes" placeholder="Any specific terms or conditions to include..." oninput="update()"></textarea>
          </div>
        </div>
      </div>

    </div><!-- /.sow-form -->

    <!-- ── PREVIEW ────────────────────────────────────────────── -->
    <div class="sow-pw">
      <div class="sow-toolbar">
        <span class="sow-toolbar-label">Live Preview</span>
        <button class="btn-print" onclick="window.print()">⬇ Print / Save PDF</button>
      </div>
      <div id="sow-doc"></div>
    </div>

  </div><!-- /.sow-builder -->
</div><!-- /.wrap -->

<script>
// ── Counters ──────────────────────────────────────────────────
var dc=0,oc=0,mc=0,cc=0,pc=0;

// ── Init ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('f-date').value=today();
  addDel(); addOOS(); addMS(); addCR();
  update();
});

function today(){ return new Date().toISOString().slice(0,10); }

// ── Toggle form sections ──────────────────────────────────────
function toggleFS(h){
  h.classList.toggle('open');
  h.nextElementSibling.classList.toggle('open');
  h.querySelector('span').textContent = h.classList.contains('open') ? '▾' : '▸';
}

// ── Field helpers ─────────────────────────────────────────────
function v(id){ var e=document.getElementById(id); return e?e.value.trim():''; }

function fmtDate(s){
  if(!s) return '';
  var d=new Date(s+'T12:00:00');
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
}

function fmtMoney(n,cur){
  return cur+' $'+parseFloat(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
}

// ── Dynamic rows ──────────────────────────────────────────────
function addDel(){
  dc++;
  var id='d'+dc;
  var r=document.createElement('div');
  r.className='dyn-row'; r.id=id;
  r.innerHTML='<input class="fi" style="flex:1" placeholder="Deliverable" oninput="update()"><input class="fi" style="flex:2" placeholder="Description" oninput="update()"><button class="btn-rm" onclick="rm(\''+id+'\')">✕</button>';
  document.getElementById('del-list').appendChild(r);
  update();
}

function addOOS(){
  oc++;
  var id='o'+oc;
  var r=document.createElement('div');
  r.className='dyn-row'; r.id=id;
  r.innerHTML='<input class="fi" style="flex:1" placeholder="Out-of-scope item" oninput="update()"><button class="btn-rm" onclick="rm(\''+id+'\')">✕</button>';
  document.getElementById('oos-list').appendChild(r);
  update();
}

function addMS(){
  mc++;
  var id='m'+mc;
  var r=document.createElement('div');
  r.className='dyn-row'; r.id=id;
  r.innerHTML='<input class="fi" style="flex:2" placeholder="Milestone name" oninput="update()"><input class="fi" style="flex:1" type="date" oninput="update()"><button class="btn-rm" onclick="rm(\''+id+'\')">✕</button>';
  document.getElementById('ms-list').appendChild(r);
  update();
}

function addCR(){
  cc++;
  var id='c'+cc;
  var r=document.createElement('div');
  r.className='dyn-row'; r.id=id;
  r.innerHTML='<input class="fi" style="flex:1" placeholder="Success criterion" oninput="update()"><button class="btn-rm" onclick="rm(\''+id+'\')">✕</button>';
  document.getElementById('cr-list').appendChild(r);
  update();
}

function addPay(){
  pc++;
  var id='p'+pc;
  var r=document.createElement('div');
  r.className='dyn-row'; r.id=id;
  r.innerHTML='<input class="fi" style="flex:2" placeholder="Payment description" oninput="update()"><input class="fi" style="flex:1" type="number" placeholder="Amount" oninput="update()"><button class="btn-rm" onclick="rm(\''+id+'\')">✕</button>';
  document.getElementById('pay-list').appendChild(r);
  update();
}

function rm(id){ var e=document.getElementById(id); if(e) e.remove(); update(); }

function refreshSched(){
  document.getElementById('custom-pay').style.display = v('f-sched')==='custom'?'block':'none';
  update();
}

// ── Collect dynamic rows ──────────────────────────────────────
function rows(containerId){
  var out=[];
  document.querySelectorAll('#'+containerId+' .dyn-row').forEach(function(r){
    var ins=r.querySelectorAll('input');
    var vals=Array.from(ins).map(function(i){return i.value.trim();});
    out.push(vals);
  });
  return out;
}

// ── Build preview ─────────────────────────────────────────────
function update(){
  var co   = v('f-co')||'[Client Company]';
  var name = v('f-name')||'[Contact Name]';
  var title= v('f-title');
  var email= v('f-email');
  var proj = v('f-project')||'[Project Name]';
  var phase= v('f-phase');
  var date = v('f-date');
  var bg   = v('f-bg');
  var total= v('f-total');
  var cur  = v('f-cur')||'USD';
  var sched= v('f-sched')||'5050';
  var terms= v('f-terms')||'14';
  var law  = v('f-law')||'Taiwan, ROC';
  var notes= v('f-notes');
  var start= v('f-start');
  var end  = v('f-end');
  var senior = !!(document.getElementById('f-senior') && document.getElementById('f-senior').checked);

  var ref='SCM-SOW-'+(date?date.replace(/-/g,''):today().replace(/-/g,''));
  var seniorBadge = senior
    ? '<span style="display:inline-flex;align-items:center;gap:4px;background:#e6f7ee;border:1px solid #2AAB6E;border-radius:3px;padding:2px 8px;font-size:10px;font-weight:700;color:#1a7a4a;margin-top:5px">&#10003; Senior BD Approved</span>'
    : '';

  // Deliverables
  var dels=rows('del-list').filter(function(r){return r[0];}).map(function(r,i){
    return '<tr><td style="color:#888;font-size:11px">'+(i+1)+'</td><td style="font-weight:600;color:#111">'+esc(r[0])+'</td><td style="color:#444">'+esc(r[1]||'')+'</td></tr>';
  }).join('');

  // OOS
  var oos=rows('oos-list').filter(function(r){return r[0];}).map(function(r){
    return '<li class="sd-list-item">'+esc(r[0])+'</li>';
  }).join('');

  // Milestones
  var msArr=rows('ms-list').filter(function(r){return r[0];});
  var ms=msArr.map(function(r){
    return '<div class="sd-ms-row"><span class="sd-ms-name">'+esc(r[0])+'</span><span class="sd-ms-date">'+fmtDate(r[1])+'</span></div>';
  }).join('');

  // Criteria
  var cr=rows('cr-list').filter(function(r){return r[0];}).map(function(r){
    return '<li>'+esc(r[0])+'</li>';
  }).join('');

  // Payment schedule
  var payHTML='';
  if(total){
    var t=parseFloat(total);
    if(sched==='5050'){
      var h=t/2;
      payHTML='<div class="sd-pay-row"><span>Invoice 1 — Upon signing</span><span>'+fmtMoney(h,cur)+'</span></div>'
             +'<div class="sd-pay-row"><span>Invoice 2 — On project completion</span><span>'+fmtMoney(h,cur)+'</span></div>';
    } else if(sched==='upfront'){
      payHTML='<div class="sd-pay-row"><span>Invoice 1 — Upon signing</span><span>'+fmtMoney(t,cur)+'</span></div>';
    } else if(sched==='completion'){
      payHTML='<div class="sd-pay-row"><span>Invoice 1 — On project completion</span><span>'+fmtMoney(t,cur)+'</span></div>';
    } else if(sched==='milestone'){
      if(msArr.length>0){
        var split=t/msArr.length;
        msArr.forEach(function(m){
          payHTML+='<div class="sd-pay-row"><span>On: '+esc(m[0])+'</span><span>'+fmtMoney(split,cur)+'</span></div>';
        });
      } else {
        payHTML='<div class="sd-pay-row"><span style="color:#888;font-style:italic">Add milestones above to split payment</span><span>'+fmtMoney(t,cur)+'</span></div>';
      }
    } else if(sched==='custom'){
      rows('pay-list').filter(function(r){return r[0];}).forEach(function(r){
        payHTML+='<div class="sd-pay-row"><span>'+esc(r[0])+'</span><span>'+(r[1]?fmtMoney(r[1],cur):'—')+'</span></div>';
      });
    }
  }

  var termsLabel = terms==='0' ? 'due on receipt' : 'Net '+terms+' days';

  var html=
    '<div class="sd-hd">'
    + '<div><div class="sd-co">SCM Solution LTD.</div><div class="sd-co-sub">Supply Chain Management &nbsp;·&nbsp; Taiwan, ROC</div></div>'
    + '<div class="sd-meta"><strong>Statement of Work</strong><div>Ref: '+ref+'</div><div>'+(fmtDate(date)||'[Date]')+'</div>'+(phase?'<div>Phase: '+phase+'</div>':'')+'</div>'
    + '</div>'

    + '<div class="sd-title">Statement of Work</div>'
    + '<div class="sd-proj">'+esc(proj)+'</div>'

    + '<div class="sd-parties">'
    + '<div><div class="sd-party-lbl">Service Provider</div><div class="sd-party-name">SCM Solution LTD.</div><div class="sd-party-det">BD Signatory</div><div class="sd-party-det">Taiwan, ROC</div><div>'+seniorBadge+'</div></div>'
    + '<div><div class="sd-party-lbl">Client</div><div class="sd-party-name">'+esc(co)+'</div>'
    +(name!=='[Contact Name]'?'<div class="sd-party-det">'+esc(name)+(title?', '+esc(title):'')+'</div>':'')
    +(email?'<div class="sd-party-det">'+esc(email)+'</div>':'')
    +'</div></div>'

    +(bg?'<div class="sd-sec"><div class="sd-sec-title">Background</div><div class="sd-text">'+esc(bg).replace(/\n/g,'<br>')+'</div></div>':'')

    + '<div class="sd-sec"><div class="sd-sec-title">Scope of Work</div>'
    +(dels?'<table class="sd-table"><thead><tr><th>#</th><th>Deliverable</th><th>Description</th></tr></thead><tbody>'+dels+'</tbody></table>'
          :'<div style="font-size:12px;color:#aaa;font-style:italic">No deliverables added yet.</div>')
    +'</div>'

    +(oos?'<div class="sd-sec"><div class="sd-sec-title">Out of Scope</div><ul class="sd-list cross">'+oos+'</ul></div>':'')

    + '<div class="sd-sec"><div class="sd-sec-title">Timeline</div>'
    +((start||end)?'<div style="font-size:12px;color:#555;margin-bottom:10px">'
      +(start?'Start: <strong>'+fmtDate(start)+'</strong>':'')
      +(start&&end?' &nbsp;·&nbsp; ':'')
      +(end?'Est. completion: <strong>'+fmtDate(end)+'</strong>':'')
      +'</div>':'')
    +(ms?'<div class="sd-ms">'+ms+'</div>':'<div style="font-size:12px;color:#aaa;font-style:italic">No milestones added yet.</div>')
    +'</div>'

    +(total?'<div class="sd-sec"><div class="sd-sec-title">Investment</div>'
    +'<div class="sd-inv">'
    +'<div class="sd-inv-total">'+fmtMoney(total,cur)+'</div>'
    +'<div class="sd-inv-note">All invoices '+termsLabel+' of issue.</div>'
    +(payHTML?'<div>'+payHTML+'</div>':'')
    +'</div></div>':'')

    +(cr?'<div class="sd-sec"><div class="sd-sec-title">Success Criteria</div><ul class="sd-list check">'+cr+'</ul></div>':'')

    + '<div class="sd-sec"><div class="sd-sec-title">Terms &amp; Conditions</div>'
    + '<div class="sd-text">'
    + '<p><strong>Confidentiality:</strong> Both parties agree to keep all project materials, pricing, and client information strictly confidential. A separate Mutual NDA governs IP and proprietary information.</p>'
    + '<p><strong>Revisions:</strong> Up to two rounds of revisions are included per deliverable. Additional revisions will be quoted separately.</p>'
    + '<p><strong>Payment:</strong> Invoices are '+termsLabel+'. Work may be paused on invoices overdue beyond 14 days.</p>'
    + '<p><strong>Intellectual Property:</strong> All deliverables transfer to the client upon receipt of full payment. SCM Solution LTD. retains no IP rights to client-specific work product.</p>'
    + '<p><strong>Termination:</strong> Either party may terminate with 14 days written notice. Work completed to the termination date is payable in full.</p>'
    + '<p><strong>Governing Law:</strong> This agreement is governed by the laws of '+esc(law)+'.</p>'
    +(notes?'<p><strong>Additional:</strong> '+esc(notes).replace(/\n/g,'<br>')+'</p>':'')
    + '</div></div>'

    + '<div class="sd-sigs">'
    + '<div><div class="sd-sig-co">SCM Solution LTD.</div>'+(senior?'<div style="margin-bottom:8px">'+seniorBadge+'</div>':'')+'<div class="sd-sig-line">BD Signatory &nbsp; / &nbsp; Date: _______________</div></div>'
    + '<div><div class="sd-sig-co">'+esc(co)+'</div><div class="sd-sig-line">'+(name!=='[Contact Name]'?esc(name)+(title?', '+esc(title):''):'Authorised Signatory')+' &nbsp; / &nbsp; Date: _______________</div></div>'
    + '</div>';

  document.getElementById('sow-doc').innerHTML=html;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
