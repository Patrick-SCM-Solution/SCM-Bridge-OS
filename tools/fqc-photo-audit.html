<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FQC Photo Audit — SCM Bridge OS</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A2E3B;--navy2:#2C4A5E;
  --teal:#1D9E75;--teal-dk:#085041;--teal-lt:#E1F5EE;--teal-bd:#5DCAA5;
  --amber:#EF9F27;--amber-lt:#FAEEDA;
  --coral:#D85A30;--coral-lt:#FAECE7;
  --gray-bg:#F5F4F1;--gray-line:#E0DED8;--gray-mid:#888780;--gray-dk:#444441;
  --white:#fff;--black:#1A1A19;--blue-btn:#1B6FA8;
}
body{font-family:'Barlow',sans-serif;background:var(--gray-bg);color:var(--black);font-size:14px;line-height:1.5}
input,textarea,select,button{font-family:inherit}
button{cursor:pointer;border:none}
.screen{display:none;min-height:100vh}.screen.active{display:block}

/* NAV OFFSET */
.page-wrap{max-width:620px;margin:0 auto;padding:20px 14px 60px}
.container{background:var(--white);padding:22px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);margin-bottom:14px}
h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--navy);border-bottom:2px solid var(--gray-line);padding-bottom:9px;margin-bottom:16px}
.form-group{margin-bottom:18px}
label{display:block;font-weight:600;margin-bottom:7px;font-size:13px;color:var(--navy2)}
input[type="text"],input[type="number"],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--gray-line);border-radius:6px;font-size:14px;background:var(--white);color:var(--black)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
textarea{resize:vertical;min-height:80px}
.btn-group{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:7px;cursor:pointer;transition:filter .15s;font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase}
.btn:hover{filter:brightness(1.07)}
.btn-primary{background:var(--blue-btn);color:var(--white)}
.btn-teal{background:var(--teal);color:var(--white)}
.btn-coral{background:var(--coral);color:var(--white)}
.btn-gray{background:var(--gray-mid);color:var(--white)}
.btn-ghost{background:var(--gray-bg);color:var(--gray-dk);border:1.5px solid var(--gray-line)}
.toggle-btn{background:var(--gray-bg);color:var(--gray-dk);border:2px solid var(--gray-line);font-size:13px;padding:11px;border-radius:7px;font-weight:700;cursor:pointer;transition:all .15s;flex:1;font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase}
.toggle-btn.selected-pass{background:var(--teal);color:var(--white);border-color:var(--teal)}
.toggle-btn.selected-fail{background:var(--coral);color:var(--white);border-color:var(--coral)}
.conditional-box{display:none;background:var(--coral-lt);border-left:4px solid var(--coral);padding:14px;margin-top:14px;border-radius:0 6px 6px 0}
canvas{border:2px dashed var(--gray-line);background:var(--gray-bg);border-radius:6px;width:100%;height:110px;display:block}
.disclaimer{font-size:12px;color:var(--gray-dk);background:var(--gray-bg);padding:14px;border-radius:6px;line-height:1.5;margin-bottom:16px;border:1px solid var(--gray-line)}
.summary-box{background:var(--gray-bg);padding:14px;border-radius:7px;margin-bottom:16px;font-size:14px;line-height:1.8;border:1px solid var(--gray-line)}
.badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:10px;display:inline-block}
.badge-amber{background:var(--amber-lt);color:var(--amber)}
.badge-builtin{background:var(--teal-lt);color:var(--teal-dk)}
.divider{border:none;border-top:1px dashed var(--gray-line);margin:16px 0}

/* HOME SCREEN */
#screen-home{background:var(--navy)}
.home-wrap{max-width:620px;margin:0 auto;padding:28px 16px 60px}
.home-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-bd);margin-bottom:6px}
.home-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:var(--white);line-height:1.1;margin-bottom:4px}
.home-sub{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:24px}
.tmpl-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.tmpl-info{flex:1;min-width:0}
.tmpl-name{font-size:15px;color:var(--white);font-weight:600;margin-bottom:2px}
.tmpl-meta{font-size:11px;color:rgba(255,255,255,.4)}
.tmpl-actions{display:flex;gap:7px;flex-shrink:0}
.btn-start{background:var(--teal);color:var(--white);border-radius:20px;padding:8px 18px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:none;cursor:pointer}
.btn-edit-tmpl{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:8px 14px;font-size:11px;cursor:pointer}
.btn-del-tmpl{color:rgba(255,80,80,.5);font-size:11px;padding:4px;cursor:pointer;background:none;border:none}
.section-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:8px;margin-top:20px}
.btn-new-tmpl{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border:1px dashed rgba(255,255,255,.25);border-radius:10px;padding:11px;font-size:13px;width:100%;cursor:pointer;margin-top:4px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em;font-weight:700;text-transform:uppercase}
.empty{text-align:center;padding:28px 0;color:rgba(255,255,255,.25);font-size:13px}

/* PHOTO SLOTS — big tap targets */
.photo-slots{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.photo-slot{background:var(--gray-bg);border:2px dashed var(--gray-line);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.photo-slot:hover,.photo-slot:active{border-color:var(--teal-bd);background:var(--teal-lt)}
.photo-slot.filled{border-style:solid;border-color:var(--teal-bd);background:var(--teal-lt)}
.photo-prompt{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px;gap:4px;text-align:center}
.photo-cam-icon{font-size:28px;line-height:1}
.photo-slot-label{font-size:12px;font-weight:700;color:var(--navy2);text-transform:uppercase;letter-spacing:.06em;font-family:'Barlow Condensed',sans-serif}
.photo-slot-hint{font-size:11px;color:var(--gray-mid)}
.photo-preview{width:100%;max-height:160px;object-fit:cover;display:none;border-top:2px solid var(--teal-bd)}

/* TEMPLATE EDITOR */
.dt-row{display:flex;gap:7px;align-items:flex-start;margin-bottom:8px}
.dt-in{flex:1;padding:8px 10px;font-size:13px;border:1px solid var(--gray-line);border-radius:6px;background:#FAFAF8;color:var(--black)}
.dt-in:focus{outline:none;border-color:var(--teal)}
.dt-rm{color:rgba(216,90,48,.4);font-size:18px;padding:4px 7px;background:none;border:none;cursor:pointer;flex-shrink:0;border-radius:4px;line-height:1}
.dt-rm:hover{color:var(--coral);background:var(--coral-lt)}
.btn-add{font-size:12px;color:var(--teal);padding:6px 12px;border:1px dashed var(--teal-bd);border-radius:7px;background:var(--teal-lt);cursor:pointer;width:100%}
.tmpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.tmpl-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="site-nav-root"></div>
<script src="../nav.js"></script>

<!-- ── HOME ─────────────────────────────────────────── -->
<div id="screen-home" class="screen active">
  <div class="home-wrap">
    <div class="home-label">SCM Solution LTD</div>
    <div class="home-title">FQC Photo Audit</div>
    <div class="home-sub">ISO 2859-1 framework · Select an audit template to begin</div>

    <div class="section-label">Built-in Templates</div>
    <div id="builtin-list"></div>

    <div class="section-label">Custom Templates</div>
    <div id="custom-list"></div>
    <button type="button" class="btn-new-tmpl" onclick="openTemplateEditor(null)">+ New Template</button>
  </div>
</div>

<!-- ── TEMPLATE EDITOR ──────────────────────────────── -->
<div id="screen-tmpl" class="screen">
  <div class="page-wrap">
    <div class="container">
      <h2 id="tmpl-editor-title">New Audit Template</h2>
      <div class="tmpl-grid">
        <div class="form-group"><label>Template Name *</label><input type="text" id="tmpl-name" placeholder="e.g. Korelock Smart Lock"/></div>
        <div class="form-group"><label>Client / Product</label><input type="text" id="tmpl-client" placeholder="e.g. Korelock"/></div>
        <div class="form-group"><label>Lot Size</label><input type="number" id="tmpl-lot" value="1000" min="1"/></div>
        <div class="form-group"><label>Sample Size</label><input type="number" id="tmpl-sample" value="20" min="1"/></div>
        <div class="form-group"><label>ISO Level</label><input type="text" id="tmpl-iso" value="S-2"/></div>
        <div class="form-group"><label>Max Defects Allowed</label><input type="number" id="tmpl-threshold" value="0" min="0"/></div>
      </div>

      <hr class="divider"/>
      <div class="form-group">
        <label>Photo Slots <span style="font-weight:400;color:var(--gray-mid)">(optional — tap target per unit)</span></label>
        <div id="photo-slot-list"></div>
        <button type="button" class="btn-add" onclick="addPhotoSlotRow()">+ Add Photo Slot</button>
      </div>

      <hr class="divider"/>
      <div class="form-group">
        <label>Test Checks <span style="font-weight:400;color:var(--gray-mid)">(each unit is assessed against these)</span></label>
        <div id="test-list"></div>
        <button type="button" class="btn-add" onclick="addTestRow()">+ Add Test</button>
      </div>

      <hr class="divider"/>
      <div class="form-group">
        <label>Disclaimer / Inspection Notice</label>
        <textarea id="tmpl-disclaimer" placeholder="Leave blank to use default SCM disclaimer"></textarea>
      </div>

      <div class="btn-group">
        <button type="button" class="btn btn-ghost" onclick="show('screen-home')">Cancel</button>
        <button type="button" class="btn btn-teal" onclick="saveTemplate()">Save Template</button>
      </div>
    </div>
  </div>
</div>

<!-- ── SCREEN 1: PERSONNEL ──────────────────────────── -->
<div id="screen-1" class="screen">
  <div class="page-wrap">
    <div class="container">
      <span class="badge badge-amber" id="s1-iso-badge"></span>
      <h2 style="margin-top:8px">Phase 1 — Personnel</h2>
      <div class="form-group"><label>Lead Auditor Name</label><input type="text" id="auditor-name" placeholder="e.g. Patrick"/></div>
      <div class="form-group"><label>Factory Manager Name</label><input type="text" id="manager-name" placeholder="e.g. Mr. Wang"/></div>
      <div class="form-group"><label>Testing Assistant</label><input type="text" id="assistant-name" placeholder="e.g. Lin"/></div>
      <div class="btn-group">
        <button type="button" class="btn btn-ghost" onclick="show('screen-home')">← Templates</button>
        <button type="button" class="btn btn-primary" onclick="goToLotCheck()">Next: Lot Check →</button>
      </div>
    </div>
  </div>
</div>

<!-- ── SCREEN 2: LOT VERIFICATION ───────────────────── -->
<div id="screen-2" class="screen">
  <div class="page-wrap">
    <div class="container">
      <h2>Phase 2 — Lot Verification</h2>
      <div class="form-group">
        <label>Master Carton Barcodes & Box Markings Acceptable?</label>
        <div class="btn-group">
          <button type="button" class="toggle-btn" id="lbl-pass" onclick="setGlobalCheck(true)">Yes / Pass</button>
          <button type="button" class="toggle-btn" id="lbl-fail" onclick="setGlobalCheck(false)">No / Fail</button>
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-ghost" onclick="show('screen-1')">← Back</button>
        <button type="button" class="btn btn-primary" id="start-loop-btn" onclick="startLoop()">Start <span id="s2-sample-label"></span>-Unit Loop →</button>
      </div>
    </div>
  </div>
</div>

<!-- ── SCREEN 3: UNIT LOOP ───────────────────────────── -->
<div id="screen-3" class="screen">
  <div class="page-wrap">
    <div class="container">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <h2 style="border:none;padding:0;margin:0">Unit <span id="current-unit-num">1</span> of <span id="total-units">20</span></h2>
        <span class="badge badge-amber" id="s3-iso-badge"></span>
      </div>
      <div id="unit-loop-body"></div>
      <div class="btn-group" style="margin-top:24px">
        <button type="button" class="btn btn-primary" onclick="submitUnit()">Submit Unit →</button>
      </div>
    </div>
  </div>
</div>

<!-- ── SCREEN 4: SUMMARY ─────────────────────────────── -->
<div id="screen-4" class="screen">
  <div class="page-wrap">
    <div class="container">
      <h2>Phase 4 — Statistical Verdict</h2>
      <div class="summary-box" id="summary-box"></div>
      <div class="disclaimer" id="disclaimer-box"></div>
      <button type="button" class="btn btn-primary" style="width:100%" onclick="goToSignatures()">Proceed to Signatures →</button>
    </div>
  </div>
</div>

<!-- ── SCREEN 5: SIGNATURES ─────────────────────────── -->
<div id="screen-5" class="screen">
  <div class="page-wrap">
    <div class="container">
      <h2>Phase 5 — Digital Validation</h2>
      <div class="form-group">
        <label>Lead Auditor Signature (<span id="sig-lbl-auditor"></span>)</label>
        <canvas id="sig-canvas-auditor"></canvas>
        <button type="button" class="btn-ghost btn" style="margin-top:6px;font-size:12px;padding:6px" onclick="clearCanvas('sig-canvas-auditor')">Clear</button>
      </div>
      <div class="form-group">
        <label>Factory Manager Counter-Signature (<span id="sig-lbl-mgr"></span>)</label>
        <canvas id="sig-canvas-manager"></canvas>
        <button type="button" class="btn-ghost btn" style="margin-top:6px;font-size:12px;padding:6px" onclick="clearCanvas('sig-canvas-manager')">Clear</button>
      </div>
      <button type="button" class="btn btn-teal" style="width:100%;margin-top:8px" onclick="exportReport()">💾 Save & Export HTML Report</button>
    </div>
  </div>
</div>

<script>
// ── BUILT-IN CONFIGS ────────────────────────────────────────────
var BUILTINS = [
  {
    id:'smart-lock', name:'Smart Lock / Access Control', client:'', lotSize:1000, sampleSize:20,
    isoLevel:'S-2', passThreshold:0, builtin:true,
    photoSlots:[{id:'packaging',label:'Packaging'},{id:'contents',label:'Contents / Accessories'},{id:'product',label:'Physical Product'}],
    tests:[
      {label:'Retail Box Inventory Complete? (Keys, Accessories, Manual, Hardware)'},
      {label:'Mechanical Key Rotation & Latch Throw Smooth?'},
      {label:'Electronic Power-Up (Audio Chime & Keypad Backlight Active)?'},
      {label:'Digital Verification (Bluetooth Pairing & Code Unlock Success)?'},
      {label:'Factory Reset Performed? (Per User Manual Standard)',yesLabel:'Yes / Reset Done',noLabel:'No / Reset Failed'}
    ],
    disclaimer:''
  },
  {
    id:'generic', name:'Generic Product Audit', client:'', lotSize:500, sampleSize:20,
    isoLevel:'S-2', passThreshold:0, builtin:true,
    photoSlots:[{id:'packaging',label:'Packaging'},{id:'product',label:'Product'}],
    tests:[
      {label:'Packaging condition acceptable?'},
      {label:'Product appearance acceptable?'},
      {label:'Product functions correctly?'}
    ],
    disclaimer:''
  }
];

var CUSTOM_KEY='scm_fqc_configs_v1';
var customConfigs=[];
var ACTIVE_CFG=null;
var appData={meta:{},units:[],currentUnitIndex:1};
var unitAnswers=[];
var unitPhotos={};
var globalLabelPass=true;
var _editingId=null;

function loadCustom(){ try{customConfigs=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]');}catch(e){customConfigs=[];} }
function saveCustom(){ localStorage.setItem(CUSTOM_KEY,JSON.stringify(customConfigs)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ── HOME ──────────────────────────────────────────────────────
function renderHome(){
  var bi=document.getElementById('builtin-list');
  bi.innerHTML=BUILTINS.map(function(c){return tmplCard(c,true);}).join('');
  var cl=document.getElementById('custom-list');
  cl.innerHTML=customConfigs.length
    ? customConfigs.map(function(c){return tmplCard(c,false);}).join('')
    : '<div class="empty">No custom templates yet</div>';
}
function tmplCard(c,builtin){
  return '<div class="tmpl-card">'
    +'<div class="tmpl-info">'
    +'<div class="tmpl-name">'+esc(c.name)+(builtin?'<span class="badge badge-builtin" style="margin-left:7px">Built-in</span>':'')+'</div>'
    +'<div class="tmpl-meta">'+(c.client?esc(c.client)+' · ':'')+'Sample '+c.sampleSize+' / Lot '+c.lotSize+' · ISO '+esc(c.isoLevel)+'</div>'
    +'</div>'
    +'<div class="tmpl-actions">'
    +(!builtin?'<button class="btn-edit-tmpl" onclick="openTemplateEditor(\''+c.id+'\')">Edit</button>':'')
    +'<button class="btn-start" onclick="startAudit(\''+c.id+'\','+(builtin?'true':'false')+')">Start →</button>'
    +(!builtin?'<button class="btn-del-tmpl" onclick="deleteTemplate(\''+c.id+'\')">✕</button>':'')
    +'</div></div>';
}
function startAudit(id,isBuiltin){
  ACTIVE_CFG=isBuiltin?BUILTINS.find(function(c){return c.id===id;}):customConfigs.find(function(c){return c.id===id;});
  if(!ACTIVE_CFG){alert('Template not found.');return;}
  appData={meta:{},units:[],currentUnitIndex:1};
  unitAnswers=new Array(ACTIVE_CFG.tests.length).fill(null);
  unitPhotos={};
  globalLabelPass=true;
  document.getElementById('s1-iso-badge').textContent='ISO 2859-1 Level '+ACTIVE_CFG.isoLevel+' · '+ACTIVE_CFG.name;
  document.getElementById('s2-sample-label').textContent=ACTIVE_CFG.sampleSize;
  document.getElementById('total-units').textContent=ACTIVE_CFG.sampleSize;
  document.getElementById('s3-iso-badge').textContent='Level '+ACTIVE_CFG.isoLevel;
  document.getElementById('lbl-pass').className='toggle-btn';
  document.getElementById('lbl-fail').className='toggle-btn';
  show('screen-1');
}

// ── TEMPLATE EDITOR ───────────────────────────────────────────
function openTemplateEditor(id){
  _editingId=id;
  var c=id?customConfigs.find(function(x){return x.id===id;}):null;
  document.getElementById('tmpl-editor-title').textContent=c?'Edit Template':'New Audit Template';
  document.getElementById('tmpl-name').value=c?c.name:'';
  document.getElementById('tmpl-client').value=c?c.client:'';
  document.getElementById('tmpl-lot').value=c?c.lotSize:1000;
  document.getElementById('tmpl-sample').value=c?c.sampleSize:20;
  document.getElementById('tmpl-iso').value=c?c.isoLevel:'S-2';
  document.getElementById('tmpl-threshold').value=c?c.passThreshold:0;
  document.getElementById('tmpl-disclaimer').value=c?c.disclaimer:'';
  renderPhotoSlotEditor(c?c.photoSlots:[{id:'packaging',label:'Packaging'},{id:'product',label:'Product'}]);
  renderTestEditor(c?c.tests:[{label:''},{label:''},{label:''}]);
  show('screen-tmpl');
}
var _photoSlots=[], _tests=[];
function renderPhotoSlotEditor(slots){
  _photoSlots=slots.map(function(s){return{id:s.id,label:s.label};});
  var el=document.getElementById('photo-slot-list'); el.innerHTML='';
  _photoSlots.forEach(function(s,i){
    var row=document.createElement('div'); row.className='dt-row';
    row.innerHTML='<input class="dt-in" placeholder="Slot label (e.g. Packaging)" value="'+esc(s.label)+'" oninput="_photoSlots['+i+'].label=this.value"/>'
      +'<button class="dt-rm" onclick="removePhotoSlot('+i+')">×</button>';
    el.appendChild(row);
  });
}
function addPhotoSlotRow(){ _photoSlots.push({id:'slot'+Date.now(),label:''}); renderPhotoSlotEditor(_photoSlots); }
function removePhotoSlot(i){ _photoSlots.splice(i,1); renderPhotoSlotEditor(_photoSlots); }
function renderTestEditor(tests){
  _tests=tests.map(function(t){return{label:t.label,yesLabel:t.yesLabel||'',noLabel:t.noLabel||''};});
  var el=document.getElementById('test-list'); el.innerHTML='';
  _tests.forEach(function(t,i){
    var row=document.createElement('div'); row.className='dt-row'; row.style.flexWrap='wrap'; row.style.gap='6px';
    row.innerHTML='<input class="dt-in" style="flex:2;min-width:200px" placeholder="Test description *" value="'+esc(t.label)+'" oninput="_tests['+i+'].label=this.value"/>'
      +'<input class="dt-in" style="flex:1;min-width:90px" placeholder="Pass label (opt)" value="'+esc(t.yesLabel)+'" oninput="_tests['+i+'].yesLabel=this.value"/>'
      +'<input class="dt-in" style="flex:1;min-width:90px" placeholder="Fail label (opt)" value="'+esc(t.noLabel)+'" oninput="_tests['+i+'].noLabel=this.value"/>'
      +'<button class="dt-rm" onclick="removeTest('+i+')">×</button>';
    el.appendChild(row);
  });
}
function addTestRow(){ _tests.push({label:'',yesLabel:'',noLabel:''}); renderTestEditor(_tests); }
function removeTest(i){ _tests.splice(i,1); renderTestEditor(_tests); }
function saveTemplate(){
  var name=document.getElementById('tmpl-name').value.trim();
  if(!name){alert('Template name is required.');return;}
  var validTests=_tests.filter(function(t){return t.label.trim();});
  if(!validTests.length){alert('Add at least one test check.');return;}
  var slots=_photoSlots.filter(function(s){return s.label.trim();}).map(function(s){return{id:s.id||'slot'+uid(),label:s.label.trim()};});
  var cfg={
    id:_editingId||uid(), name:name,
    client:document.getElementById('tmpl-client').value.trim(),
    lotSize:parseInt(document.getElementById('tmpl-lot').value)||1000,
    sampleSize:parseInt(document.getElementById('tmpl-sample').value)||20,
    isoLevel:document.getElementById('tmpl-iso').value.trim()||'S-2',
    passThreshold:parseInt(document.getElementById('tmpl-threshold').value)||0,
    photoSlots:slots,
    tests:validTests.map(function(t){return{label:t.label.trim(),yesLabel:t.yesLabel.trim(),noLabel:t.noLabel.trim()};}),
    disclaimer:document.getElementById('tmpl-disclaimer').value.trim()
  };
  if(_editingId){
    var idx=customConfigs.findIndex(function(c){return c.id===_editingId;});
    if(idx!==-1)customConfigs[idx]=cfg; else customConfigs.push(cfg);
  } else { customConfigs.push(cfg); }
  saveCustom(); renderHome(); show('screen-home');
}
function deleteTemplate(id){
  if(!confirm('Delete this template?'))return;
  customConfigs=customConfigs.filter(function(c){return c.id!==id;});
  saveCustom(); renderHome();
}

// ── AUDIT FLOW ────────────────────────────────────────────────
function setGlobalCheck(pass){
  globalLabelPass=pass;
  document.getElementById('lbl-pass').className=pass?'toggle-btn selected-pass':'toggle-btn';
  document.getElementById('lbl-fail').className=!pass?'toggle-btn selected-fail':'toggle-btn';
}
function goToLotCheck(){
  var a=document.getElementById('auditor-name').value.trim();
  if(!a){alert('Please enter the lead auditor name.');return;}
  appData.meta.auditor=a;
  appData.meta.manager=document.getElementById('manager-name').value.trim()||'Factory Representative';
  appData.meta.assistant=document.getElementById('assistant-name').value.trim()||'Factory Assistant';
  show('screen-2');
}
function startLoop(){
  appData.currentUnitIndex=1;
  document.getElementById('current-unit-num').textContent=1;
  renderUnitLoop();
  show('screen-3');
}

function renderUnitLoop(){
  var cfg=ACTIVE_CFG;
  var html='';

  /* Photo slots */
  if(cfg.photoSlots&&cfg.photoSlots.length){
    html+='<div style="margin-bottom:16px"><label style="display:block;font-weight:600;font-size:13px;color:var(--navy2);margin-bottom:8px">📷 Photos <span style="font-weight:400;color:var(--gray-mid);font-size:11px">— optional, tap to open camera</span></label>';
    html+='<div class="photo-slots">';
    cfg.photoSlots.forEach(function(slot){
      var filled=unitPhotos[slot.id]?true:false;
      html+='<div class="photo-slot'+(filled?' filled':'')+'" id="tile-'+slot.id+'" onclick="document.getElementById(\'inp-'+slot.id+'\').click()">'
        +'<div class="photo-prompt"><span class="photo-cam-icon">📷</span><span class="photo-slot-label">'+esc(slot.label)+'</span>'
        +(filled?'<span class="photo-slot-hint" style="color:var(--teal-dk)">✓ Photo taken — tap to replace</span>':'<span class="photo-slot-hint">Tap to open camera</span>')
        +'</div>'
        +'<img id="prev-'+slot.id+'" class="photo-preview" '+(filled?'src="'+slot._src+'" style="display:block"':'')+'>'
        +'<input type="file" id="inp-'+slot.id+'" accept="image/*" capture="environment" style="display:none" onchange="processPhoto(\''+slot.id+'\',this)"/>'
        +'</div>';
    });
    html+='</div></div><hr class="divider"/>';
  }

  /* Tests */
  cfg.tests.forEach(function(t,i){
    var ans=unitAnswers[i];
    var yLbl=t.yesLabel||'Pass';
    var nLbl=t.noLabel||'Fail';
    html+='<div class="form-group"><label>'+(i+1)+'. '+esc(t.label)+'</label>'
      +'<div class="btn-group">'
      +'<button type="button" class="toggle-btn'+(ans===true?' selected-pass':'')+'" onclick="setAnswer('+i+',true)">'+esc(yLbl)+'</button>'
      +'<button type="button" class="toggle-btn'+(ans===false?' selected-fail':'')+'" onclick="setAnswer('+i+',false)">'+esc(nLbl)+'</button>'
      +'</div></div>';
  });

  /* Failure context (shown when any answer is false) */
  var hasFail=unitAnswers.includes(false);
  html+='<div id="failure-context" class="conditional-box" style="display:'+(hasFail?'block':'none')+'">'
    +'<label>⚠️ Defect Witnessed By:</label>'
    +'<select id="witness-dropdown">'
    +'<option>'+esc(appData.meta.assistant)+'</option>'
    +'<option>'+esc(appData.meta.manager)+'</option>'
    +'<option>'+esc(appData.meta.auditor)+'</option>'
    +'</select>'
    +'<label style="margin-top:12px">Defect Close-Up Photo <span style="font-weight:400;color:var(--gray-mid);font-size:11px">(recommended)</span></label>'
    +'<div class="photo-slot'+(unitPhotos['defect']?' filled':'')+'" id="tile-defect" onclick="document.getElementById(\'inp-defect\').click()" style="margin-top:6px">'
    +'<div class="photo-prompt"><span class="photo-cam-icon">📷</span><span class="photo-slot-label">Defect Close-Up</span>'
    +(unitPhotos['defect']?'<span class="photo-slot-hint" style="color:var(--teal-dk)">✓ Photo taken</span>':'<span class="photo-slot-hint">Tap to photograph defect</span>')+'</div>'
    +'<img id="prev-defect" class="photo-preview" '+(unitPhotos['defect']?'src="'+unitPhotos['defect']+'" style="display:block"':'')+'>'
    +'<input type="file" id="inp-defect" accept="image/*" capture="environment" style="display:none" onchange="processPhoto(\'defect\',this)"/>'
    +'</div>'
    +'<label style="margin-top:12px">Technical Notes / Defect Description</label>'
    +'<input type="text" id="defect-notes" placeholder="e.g. Lock failed to power on; backup key stuck" style="margin-top:4px"/>'
    +'</div>';

  document.getElementById('unit-loop-body').innerHTML=html;
}

function setAnswer(i,val){
  unitAnswers[i]=val;
  renderUnitLoop();
}

function processPhoto(slotId,inp){
  var file=inp.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    unitPhotos[slotId]=e.target.result;
    /* Update slot src for re-render reference */
    if(ACTIVE_CFG.photoSlots){
      var s=ACTIVE_CFG.photoSlots.find(function(p){return p.id===slotId;});
      if(s)s._src=e.target.result;
    }
    var tile=document.getElementById('tile-'+slotId);
    if(tile)tile.classList.add('filled');
    var prev=document.getElementById('prev-'+slotId);
    if(prev){prev.src=e.target.result;prev.style.display='block';}
    var hint=tile?tile.querySelector('.photo-slot-hint'):null;
    if(hint)hint.textContent='✓ Photo taken — tap to replace';
    if(hint)hint.style.color='var(--teal-dk)';
  };
  reader.readAsDataURL(file);
}

function submitUnit(){
  var unanswered=unitAnswers.findIndex(function(a){return a===null;});
  if(unanswered!==-1){
    alert('Please answer all '+(unanswered+1>1?'test '+( unanswered+1):' tests')+' before continuing.');
    return;
  }
  var isDefective=unitAnswers.includes(false);
  appData.units.push({
    unit_id:appData.currentUnitIndex,
    results:unitAnswers.slice(),
    status:isDefective?'FAILED':'PASSED',
    witness:isDefective?(document.getElementById('witness-dropdown')?document.getElementById('witness-dropdown').value:'N/A'):'N/A',
    notes:isDefective?(document.getElementById('defect-notes')?document.getElementById('defect-notes').value:''):'',
    photos:Object.assign({},unitPhotos)
  });

  if(appData.currentUnitIndex<ACTIVE_CFG.sampleSize){
    appData.currentUnitIndex++;
    document.getElementById('current-unit-num').textContent=appData.currentUnitIndex;
    unitAnswers=new Array(ACTIVE_CFG.tests.length).fill(null);
    unitPhotos={};
    if(ACTIVE_CFG.photoSlots)ACTIVE_CFG.photoSlots.forEach(function(s){s._src=null;});
    renderUnitLoop();
    window.scrollTo(0,0);
  } else {
    showSummary();
  }
}

function showSummary(){
  var passed=appData.units.filter(function(u){return u.status==='PASSED';}).length;
  var failed=appData.units.filter(function(u){return u.status==='FAILED';}).length;
  var cfg=ACTIVE_CFG;
  var reject=failed>cfg.passThreshold||!globalLabelPass;
  var verdictColor=reject?'var(--coral)':'var(--teal)';
  var verdictText=reject
    ?(failed>cfg.passThreshold
        ?'CRITICAL DEFECT RATE BREACHED — WITHHOLD SHIPMENT'
        :'LOT LABELLING FAILED — WITHHOLD SHIPMENT')
    :'SAMPLE CONFORMS — PENDING FINAL CORPORATE RELEASE';

  document.getElementById('summary-box').innerHTML=
    '<strong>Sampling Protocol:</strong> ISO 2859-1 Level '+esc(cfg.isoLevel)+'<br/>'
    +'<strong>Template:</strong> '+esc(cfg.name)+'<br/>'
    +'<strong>Sample Evaluated:</strong> '+cfg.sampleSize+' units (from lot of '+cfg.lotSize+')<br/>'
    +'<strong>Conforming:</strong> <span style="color:var(--teal);font-weight:700">'+passed+'</span><br/>'
    +'<strong>Non-Conforming:</strong> <span style="color:var(--coral);font-weight:700">'+failed+'</span><br/>'
    +'<strong>Max Defects Allowed:</strong> '+cfg.passThreshold+'<br/>'
    +'<strong>Verdict:</strong> <span style="color:'+verdictColor+';font-weight:700">'+verdictText+'</span>';

  var disc=cfg.disclaimer||
    'INSPECTION NOTICE & LIABILITY DISCLAIMER: This evaluation is a limited '+cfg.sampleSize+'-unit engineering screener conducted by '
    +(appData.meta.auditor||'SCM Solution LTD')+'. It represents a statistical snapshot of the tested samples only and does not constitute a '
    +'legal or commercial release of the '+cfg.lotSize+'-unit lot. Final shipment authorisation remains subject to corporate management review. '
    +'The factory maintains 100% liability for any latent defects found in the uninspected balance of this shipment.';
  document.getElementById('disclaimer-box').innerHTML='<strong>Inspection Notice:</strong> '+esc(disc);
  show('screen-4');
}

function goToSignatures(){
  document.getElementById('sig-lbl-auditor').textContent=appData.meta.auditor||'Auditor';
  document.getElementById('sig-lbl-mgr').textContent=appData.meta.manager||'Factory Representative';
  show('screen-5');
  setupSigs();
}

function clearCanvas(id){
  var c=document.getElementById(id);
  c.getContext('2d').clearRect(0,0,c.width,c.height);
}

function setupSigs(){
  ['sig-canvas-auditor','sig-canvas-manager'].forEach(function(id){
    var canvas=document.getElementById(id);
    var ctx=canvas.getContext('2d');
    var drawing=false;
    function pos(e){
      var r=canvas.getBoundingClientRect();
      var cx=e.touches?e.touches[0].clientX:e.clientX;
      var cy=e.touches?e.touches[0].clientY:e.clientY;
      return{x:(cx-r.left)*(canvas.width/r.width),y:(cy-r.top)*(canvas.height/r.height)};
    }
    canvas.addEventListener('mousedown',function(){drawing=true;});
    canvas.addEventListener('mouseup',function(){drawing=false;ctx.beginPath();});
    canvas.addEventListener('mouseleave',function(){drawing=false;ctx.beginPath();});
    canvas.addEventListener('touchstart',function(e){drawing=true;e.preventDefault();},{passive:false});
    canvas.addEventListener('touchend',function(){drawing=false;ctx.beginPath();});
    canvas.addEventListener('mousemove',function(e){
      if(!drawing)return;
      ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#111';
      var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);
    });
    canvas.addEventListener('touchmove',function(e){
      if(!drawing)return;
      e.preventDefault();
      ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#111';
      var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);
    },{passive:false});
  });
}

function exportReport(){
  var cfg=ACTIVE_CFG;
  var passed=appData.units.filter(function(u){return u.status==='PASSED';}).length;
  var failed=appData.units.filter(function(u){return u.status==='FAILED';}).length;

  var audSig=document.getElementById('sig-canvas-auditor').toDataURL();
  var mgrSig=document.getElementById('sig-canvas-manager').toDataURL();
  var date=new Date().toLocaleDateString();

  function photoRowHtml(label,src){
    return src?'<div style="margin-top:8px"><strong style="font-size:12px;color:#555">'+label+'</strong><br/><img src="'+src+'" style="max-width:100%;max-height:200px;border-radius:6px;border:1px solid #ddd;margin-top:4px;display:block"/></div>':'';
  }

  var unitRows=appData.units.map(function(u){
    var testRows=cfg.tests.map(function(t,i){
      var ans=u.results[i];

      var bg=ans?'#d4edda':'#f8d7da';

    }).join('');
    var photoHtml='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px">';
    if(cfg.photoSlots)cfg.photoSlots.forEach(function(s){if(u.photos[s.id])photoHtml+=photoRowHtml(s.label,u.photos[s.id]);});
    if(u.photos.defect)photoHtml+=photoRowHtml('Defect Close-Up',u.photos.defect);
    photoHtml+='</div>';
    return '<div style="border:1px solid #e0e0e0;border-radius:8px;padding:14px;margin-bottom:12px;background:'+(u.status==='FAILED'?'#fff8f6':'#fff')+'">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'
      +'<strong style="font-size:15px">Unit #'+u.unit_id+'</strong>'
      +'<span style="background:'+(u.status==='PASSED'?'#d4edda':'#f8d7da')+';color:'+(u.status==='PASSED'?'#155724':'#721c24')+';padding:3px 9px;border-radius:4px;font-size:11px;font-weight:700">'+u.status+'</span>'
      +'</div>'
      +'<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tbody>'+testRows+'</tbody></table>'
      +photoHtml
      +(u.status==='FAILED'?'<div style="margin-top:8px;font-size:12px;color:#666"><strong>Witness:</strong> '+u.witness+'<br/><strong>Notes:</strong> '+(u.notes||'—')+'</div>':'')
      +'</div>';
  }).join('');

  var disc=cfg.disclaimer||
    'INSPECTION NOTICE & LIABILITY DISCLAIMER: This evaluation is a limited '+cfg.sampleSize+'-unit engineering screener conducted by '
    +(appData.meta.auditor||'SCM Solution LTD')+'. It represents a statistical snapshot of the tested samples only and does not constitute a '
    +'legal or commercial release of the '+cfg.lotSize+'-unit lot. Final shipment authorisation remains subject to corporate management review. '
    +'The factory maintains 100% liability for any latent defects found in the uninspected balance of this shipment.';

  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>FQC Report — '+cfg.name+'</title>'
    +'<style>body{font-family:Arial,sans-serif;background:#f0f2f5;padding:24px;color:#222}'
    +'.card{background:#fff;max-width:740px;margin:0 auto;padding:28px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1)}'
    +'.hdr{border-bottom:3px solid #1D9E75;padding-bottom:10px;margin-bottom:20px}'
    +'.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f8f9fa;padding:14px;border-radius:6px;margin-bottom:20px;font-size:13px}'
    +'.disc{font-size:11px;color:#555;background:#e9ecef;padding:14px;border-radius:6px;margin-top:24px;line-height:1.5}'
    +'.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}'
    +'.sig-box{border:1px solid #ddd;background:#fafafa;padding:10px;text-align:center;border-radius:6px;font-size:12px}'
    +'.sig-box img{max-width:100%;height:auto;max-height:80px}'
    +'</style></head><body><div class="card">'
    +'<div class="hdr"><div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1D9E75;margin-bottom:4px">SCM Solution LTD</div>'
    +'<h1 style="font-size:22px;margin-bottom:2px">FQC Technical Evaluation Report</h1>'
    +'<div style="font-size:13px;color:#666">'+esc(cfg.name)+(cfg.client?' · '+esc(cfg.client):'')+'</div></div>'
    +'<div class="meta">'
    +'<div><strong>Date:</strong> '+date+'</div>'
    +'<div><strong>Lead Auditor:</strong> '+esc(appData.meta.auditor)+'</div>'
    +'<div><strong>Factory Manager:</strong> '+esc(appData.meta.manager)+'</div>'
    +'<div><strong>Assistant:</strong> '+esc(appData.meta.assistant)+'</div>'
    +'<div><strong>Protocol:</strong> ISO 2859-1 Level '+esc(cfg.isoLevel)+' · '+cfg.sampleSize+' units / lot of '+cfg.lotSize+'</div>'
    +'<div><strong>Lot Labels:</strong> '+(globalLabelPass?'✓ Pass':'✗ Fail')+'</div>'
    +'<div><strong>Conforming:</strong> '+passed+'</div>'
    +'<div><strong>Non-Conforming:</strong> '+failed+'</div>'
    +'<div style="grid-column:span 2;border-top:1px solid #ddd;padding-top:8px"><strong>Verdict:</strong> <span style="color:'+(reject?'#D85A30':'#1D9E75')+';font-weight:700">'+verdict+'</span></div>'
    +'</div>'
    +'<h3 style="margin-bottom:12px">Unit Testing Matrix</h3>'
    +unitRows
    +'<div class="disc">'+esc(disc)+'</div>'
    +'<div class="sig-row">'
    +'<div class="sig-box"><strong>Lead Auditor</strong><br/>'+esc(appData.meta.auditor)+'<br/><img src="'+audSig+'"/></div>'
    +'<div class="sig-box"><strong>Factory Witness</strong><br/>'+esc(appData.meta.manager)+'<br/><img src="'+mgrSig+'"/></div>'
    +'</div>'
    +'</div></body></html>';

  var blob=new Blob([html],{type:'text/html'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='FQC_'+cfg.name.replace(/[^a-zA-Z0-9]/g,'-')+'_'+date.replace(/\//g,'-')+'.html';
  a.click(); URL.revokeObjectURL(a.href);
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
